$kind: http-request
name: 'Get site'
order: 1000
method: GET
url: '{{baseUrl}}/api/sites/:siteSlug'
pathVariables:
  - key: siteSlug
    value: northlight-studio
headers:
  - key: Accept
    value: application/json
examples: './.resources/Get site.resources/examples/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const colorRe = /^#[0-9a-fA-F]{3,8}$/
      const pageKeys = ['home', 'projects', 'about']
      const sectionTypes = ['hero', 'projects', 'pricing', 'about-contact']

      pm.test('status is 200', () => pm.response.to.have.status(200))

      pm.test('is cacheable at the edge', () => {
        pm.expect(pm.response.headers.get('Cache-Control')).to.eql('s-maxage=60, stale-while-revalidate=300')
      })

      const site = pm.response.json()

      pm.test('slug matches the requested site', () => {
        pm.expect(site.slug).to.eql(pm.request.url.variables.get('siteSlug'))
      })

      pm.test('brand has name, urls, font and hex colors', () => {
        pm.expect(site.brand).to.include.all.keys('name', 'logoUrl', 'faviconUrl', 'fontFamily', 'colors')
        pm.expect(site.brand.fontFamily).to.match(/^[A-Za-z0-9 ]{1,60}$/)
        ;['primary', 'secondary', 'accent', 'background', 'text'].forEach((k) => pm.expect(site.brand.colors[k], k).to.match(colorRe))
      })

      pm.test('seo has ogImage and canonicalUrl', () => {
        pm.expect(site.seo).to.include.all.keys('ogImage', 'canonicalUrl')
      })

      pm.test('navigation links are label/href pairs', () => {
        pm.expect(site.navigation).to.be.an('array').that.is.not.empty
        site.navigation.forEach((l) => pm.expect(l).to.include.all.keys('label', 'href'))
      })

      pm.test('has home, projects and about pages with typed sections', () => {
        pm.expect(site.pages).to.have.all.keys(pageKeys)
        pageKeys.forEach((key) => {
          const page = site.pages[key]
          pm.expect(page, key).to.include.all.keys('title', 'description', 'sections')
          pm.expect(page.sections, key).to.be.an('array').that.is.not.empty
          page.sections.forEach((s) => {
            pm.expect(sectionTypes).to.include(s.type)
            pm.expect(s).to.include.all.keys('id', 'title')
          })
        })
      })
