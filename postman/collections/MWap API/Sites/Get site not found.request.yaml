$kind: http-request
name: 'Get site not found'
order: 2000
method: GET
url: '{{baseUrl}}/api/sites/:siteSlug'
pathVariables:
  - key: siteSlug
    value: does-not-exist
headers:
  - key: Accept
    value: application/json
examples: './.resources/Get site not found.resources/examples/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))

      pm.test('error body names the slug', () => {
        const body = pm.response.json()
        pm.expect(body.statusCode).to.eql(404)
        pm.expect(body.statusMessage).to.include('does-not-exist')
      })
