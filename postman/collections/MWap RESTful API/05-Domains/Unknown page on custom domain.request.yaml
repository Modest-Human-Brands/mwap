$kind: http-request
name: 'Unknown page on custom domain'
description: |-
  A template with one page (home) answers any other path under the domain root with its own 404 page, not with a bare error.
order: 2000
method: GET
url: '{{baseUrl}}/projects'
headers:
  - key: Accept
    value: 'text/html'
  - key: Host
    value: '{{customDomain}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))
      pm.test('is an html page', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the site of the domain', () => pm.expect(pm.response.text()).to.include('Iris Vale Studio'))
      pm.test('the page links home without a slug', () => pm.expect(pm.response.text()).to.not.include('/' + pm.collectionVariables.get('newSiteSlug') + '/'))
examples: './.resources/Unknown page on custom domain.resources/examples/'
