$kind: http-example
name: '200 Sitemap'
order: 1000
request:
  url: '{{baseUrl}}/sitemap.xml'
  method: GET
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/xml'
  body:
    type: text
    content: |-
      <?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://harbor.example.com/</loc></url><url><loc>http://harbor.example.com/projects</loc></url><url><loc>http://harbor.example.com/about</loc></url></urlset>
