$kind: http-request
name: 'Www redirects to apex'
description: |-
  www.<domain> redirects (301) to the apex domain, keeping the path.
order: 4000
method: GET
url: '{{baseUrl}}/projects'
headers:
  - key: Accept
    value: 'text/html'
  - key: Host
    value: 'www.{{customDomain}}'
settings:
  followRedirects: false
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 301', () => pm.response.to.have.status(301))
      pm.test('points to the apex domain', () => pm.expect(pm.response.headers.get('Location')).to.eql('http://' + pm.collectionVariables.get('customDomain') + '/projects'))
examples: './.resources/Www redirects to apex.resources/examples/'
