scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('microverseFormsSlug', 'pm-microverse-forms-' + Date.now())
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('stores the endpoint and the phone', () => { const { data } = pm.response.json(); pm.expect(data.contact.bookingEndpoint).to.eql('https://postman-echo.com/post'); pm.expect(data.contact.phone).to.eql('+1 555 0100') })
