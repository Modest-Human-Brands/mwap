$kind: http-request
name: 'Create site with booking endpoint'
description: |-
  Creates a Microverse site whose data.contact.bookingEndpoint is an https URL of a public host; the Book a Session form is relayed to it. The slug is kept in microverseFormsSlug. The next requests use postman-echo.com as the receiver, so they need network access.
order: 2000
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Accept
    value: 'application/json'
  - key: Content-Type
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
  - key: x-user-id
    value: '{{userId}}'
body:
  type: json
  content: |-
    {
      "slug": "{{microverseFormsSlug}}",
      "templateId": "portfolio-photographer-microverse",
      "brand": {
        "name": "Nova Frame",
