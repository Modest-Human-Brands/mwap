$kind: http-request
name: 'Get episode not found'
description: |-
  An unknown episode answers 404 with the error body of the API.
order: 1520
method: GET
url: '{{baseUrl}}/api/site/:slug/episodes/:episode'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: episode
    value: 'nope'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))
      pm.test('has the error body', () => pm.expect(pm.response.json().error).to.eql(true))
