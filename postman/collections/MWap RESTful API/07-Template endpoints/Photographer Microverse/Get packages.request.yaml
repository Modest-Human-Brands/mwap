$kind: http-request
name: 'Get packages'
description: |-
  The price cards of the site in order: slug, title, subtitle, price (text, so "custom" is possible), unit and the feature list.
order: 1400
method: GET
url: '{{baseUrl}}/api/site/:slug/packages'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is cacheable like the site', () => pm.expect(pm.response.headers.get('Cache-Control')).to.match(/s-maxage/))

      pm.test('matches Packages schema', () => pm.response.to.have.jsonSchema({ type: 'array', minItems: 1, maxItems: 4, items: { type: 'object', required: ['slug', 'title', 'subtitle', 'price', 'unit', 'features'], properties: { price: { type: 'string' }, features: { type: 'array', minItems: 1, maxItems: 10, items: { type: 'string' } } } } }))
      pm.test('keeps the order of the site', () => pm.expect(pm.response.json().map((p) => p.slug)).to.eql(['standard', 'custom']))
