$kind: http-request
name: 'Get featured photos'
description: |-
  `featured=true` keeps the featured photos ordered by their featured position (the bento order), not by the order of the site.
order: 1030
method: GET
url: '{{baseUrl}}/api/site/:slug/photos?featured=true'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('only the featured photos, by position', () => pm.expect(pm.response.json().map((p) => p.slug)).to.eql(['frame-one', 'frame-three']))
