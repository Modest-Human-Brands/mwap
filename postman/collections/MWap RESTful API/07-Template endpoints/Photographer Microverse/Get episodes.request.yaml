$kind: http-request
name: 'Get episodes'
description: |-
  The episodes of the site in order: slug, title, excerpt, thumbnailUrl, publishedAt (a date), videoUrl when the episode has a video and the body (paragraphs).
order: 1500
method: GET
url: '{{baseUrl}}/api/site/:slug/episodes'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is cacheable like the site', () => pm.expect(pm.response.headers.get('Cache-Control')).to.match(/s-maxage/))
      pm.test('matches Episodes schema', () => pm.response.to.have.jsonSchema({ type: 'array', minItems: 1, items: { type: 'object', required: ['slug', 'title', 'excerpt', 'thumbnailUrl', 'publishedAt', 'body'], properties: { publishedAt: { type: 'string', pattern: '^\\d{4}-\\d{2}-\\d{2}$' }, body: { type: 'array', items: { type: 'string' } } } } }))
      pm.test('keeps the order of the site', () => pm.expect(pm.response.json()[0].slug).to.eql('chocolate-product-shoot'))
