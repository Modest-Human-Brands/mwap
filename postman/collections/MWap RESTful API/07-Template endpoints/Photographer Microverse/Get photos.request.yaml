$kind: http-request
name: 'Get photos'
description: |-
  Every photo of the site in the order of the site, with all its fields.
order: 1000
method: GET
url: '{{baseUrl}}/api/site/:slug/photos'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is cacheable like the site', () => pm.expect(pm.response.headers.get('Cache-Control')).to.match(/s-maxage/))
      pm.test('does not expose who owns the site', () => pm.expect(pm.response.text()).to.not.include('createdBy'))

      pm.test('matches Photos schema', () => pm.response.to.have.jsonSchema({ type: 'array', minItems: 1, items: { type: 'object', required: ['slug', 'title', 'imageUrl', 'aspectRatio', 'category', 'gallery', 'featured'], properties: { aspectRatio: { type: 'number', exclusiveMinimum: 0 }, gallery: { type: 'boolean' }, featured: { type: ['integer', 'null'] } } } }))
      pm.test('keeps the order of the site', () => pm.expect(pm.response.json().map((p) => p.slug)).to.eql(['frame-one', 'frame-two', 'frame-three']))
