$kind: http-request
name: 'Get episode'
description: |-
  One episode by slug.
order: 1510
method: GET
url: '{{baseUrl}}/api/site/:slug/episodes/:episode'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: episode
    value: 'chocolate-product-shoot'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is the episode', () => { const e = pm.response.json(); pm.expect(e.slug).to.eql('chocolate-product-shoot'); pm.expect(e.title).to.include('Chocolate packaging shoot') })
