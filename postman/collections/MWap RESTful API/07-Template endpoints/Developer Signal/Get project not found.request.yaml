$kind: http-request
name: 'Get project not found'
description: |-
  A project slug the site does not have answers 404, with the Nitro error shape.
order: 1110
method: GET
url: '{{baseUrl}}/api/site/:slug/projects/:project'
pathVariables:
  - key: slug
    value: '{{shareSlug}}'
  - key: project
    value: 'no-such-project'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))
      pm.test('has the error shape', () => { pm.expect(pm.response.json()).to.have.property('statusCode') })
