$kind: http-request
name: 'Get projects of another template'
description: |-
  The route belongs to the Signal template. The built-in example site uses another template, so the answer is 404 and not an empty list: the endpoint does not exist for that site.
order: 1600
method: GET
url: '{{baseUrl}}/api/site/:slug/projects'
pathVariables:
  - key: slug
    value: '{{siteSlug}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))
      pm.test('has the error shape', () => { pm.expect(pm.response.json()).to.have.property('statusCode') })
