$kind: http-request
name: 'Send contact message'
description: |-
  Public. Checks the body and relays it to the bookingEndpoint of the site. 202 means the receiver accepted it; nothing is stored by MWap. Body: name (1 to 120 characters), email, message (1 to 4000 characters), optional company (at most 120).
order: 2100
method: POST
url: '{{baseUrl}}/api/site/:slug/contact'
pathVariables:
  - key: slug
    value: '{{formsSlug}}'
headers:
  - key: Accept
    value: 'application/json'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "name": "Sam Example",
      "email": "sam@example.com",
      "message": "Hello, I would like to talk about a Rust project."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 202', () => pm.response.to.have.status(202))
      pm.test('says it was delivered', () => pm.expect(pm.response.json()).to.eql({ delivered: true }))
      pm.test('is never cached', () => pm.expect(pm.response.headers.get('Cache-Control')).to.match(/no-store/))
