$kind: http-request
name: 'Get certificates'
description: |-
  The certificates of the education block: name, issuer, year and the optional credential id and URL. An empty list is valid (200 with []).
order: 1400
method: GET
url: '{{baseUrl}}/api/site/:slug/certificates'
pathVariables:
  - key: slug
    value: '{{shareSlug}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Certificates schema', () => pm.response.to.have.jsonSchema({ type: 'array', items: { type: 'object', required: ['name', 'issuer', 'year'] } }))
