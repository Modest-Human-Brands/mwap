$kind: http-request
name: 'Get project'
description: |-
  One project in full, including overview, capabilities and releases. The sample content of the template has the project rune-infer.
order: 1100
method: GET
url: '{{baseUrl}}/api/site/:slug/projects/:project'
pathVariables:
  - key: slug
    value: '{{shareSlug}}'
  - key: project
    value: 'rune-infer'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is the project that was asked for', () => pm.expect(pm.response.json().slug).to.eql('rune-infer'))
      pm.test('matches Project schema', () => pm.response.to.have.jsonSchema({ type: 'object', required: ['slug', 'name', 'summary', 'posterUrl', 'stack', 'version', 'updated', 'status', 'url', 'overview', 'capabilities', 'releases'], properties: { capabilities: { type: 'array', minItems: 1 }, releases: { type: 'array', minItems: 1 } } }))
