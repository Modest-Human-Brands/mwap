$kind: collection
name: MWap RESTful API
description: |-
  Contract for the MWap site-builder microservice (Nuxt/Nitro): pick a template, send a brand and a payload, get a website.
  The zod schemas in the service are the runtime source of truth; this collection documents and tests the contract.
  Write endpoints (create/replace/delete site) need the x-api-key header (secret environment variable apiKey) and the x-org-id header (lowercase slug-style organization id). Every site belongs to exactly one organization, slugs stay unique across all of them, and reads are public. Deleting a site (DELETE /api/site/:slug, 204) removes it completely and frees its domains; only sites saved through the API can be deleted, the built-in example and Notion rows answer 409. A site without an organization (older stored sites, the built-in example, a Notion row without an Organization relation) belongs to the organization "default". A Notion row gets its organization from its Organization relation (the related page title, slugified).
  A site can own custom domains: a request whose Host matches one is served at the domain root (/ instead of /<slug>); a page the template does not have answers with the template's own 404 page; www redirects to the apex, slug paths redirect to the clean URL, any other host keeps the /<slug> routes.
  Where sites come from: a site saved through the API wins, then a published row of the Notion database (read-only, edits show up within about 60 seconds), then the built-in example. Without a Notion token only the API-saved sites and the example exist. When Notion cannot be reached and nothing is cached, reads answer 503.
  Two templates exist: contact-sheet (category Portfolios, a single-page model portfolio) and psychiatrist-editorial (category Psychiatrists, two pages: home with the slots hero, ticker, statement, care, approach, appointment and closing, and about with hero, story, credentials, clinic, testimonial and closing; data.contact has email, an optional phone and an optional bookingEndpoint). A site also has an optional googleAnalyticsId (a GA4 measurement id): it reports only to its own property. The layout is fixed and only the content is editable: data.pages.<page> has named slots, never a list of sections. For example the contact-sheet template is a single page: home has the slots cover, index, sheet, compCard, booking and footer; data.contact carries the booking email and an optional bookingEndpoint (a URL the booking forms POST to; without it the forms open a mailto link). Each slot has `enabled` (false hides the section but keeps its content) and its text, links and images; card lists (index items, sheet frames, comp card measurements and stats, footer links) can grow and shrink within limits published in the JSON Schema of "Get template by ID". Brand colors map to the template as primary (accent color), secondary (paper), accent (index numbers and labels), background and text; the template's typefaces are fixed and brand.fontFamily sets the body font. Unknown keys, pages or slots, and a `sections` list, answer 400.
  Errors use the Nitro shape { statusCode, statusMessage, message, data? }; validation failures return 400 with data.errors[{ field, message, code }].
variables:
  - key: baseUrl
    value: 'http://localhost:3000'
    description: Base URL of the MWap service
  - key: templateId
    value: contact-sheet
    description: Template used by the requests
  - key: siteSlug
    value: nova-marek
    description: Seeded read-only example site
  - key: newSiteSlug
    value: pm-example-site
    description: Slug created by the Create site request (regenerated on every run)
  - key: customDomain
    value: pm-example-site.example.test
    description: Domain given to the created site (regenerated on every run); the Domains requests send it as Host header
  - key: orgId
    value: pm-org
    description: Organization that owns the created site, sent as x-org-id header on writes
  - key: otherOrgId
    value: pm-other-org
    description: A different organization, used to prove that it cannot replace the site of orgId
