$kind: collection
name: MWap RESTful API
description: |-
  Contract for the MWap site-builder microservice (Nuxt/Nitro): pick a template, send a brand and a payload, get a website.
  The zod schemas in the service are the runtime source of truth; this collection documents and tests the contract.
  Write endpoints (create/replace/delete site) need three headers: x-api-key (secret environment variable apiKey), x-org-id (lowercase slug-style organization id) and x-user-id (who makes the change, 1 to 120 characters). They are checked in that order: a wrong or missing key answers 401 first, then an invalid organization or user answers 400. Every site belongs to exactly one organization, slugs stay unique across all of them, and a site page and one site (GET /api/site/:slug) are public. The list (GET /api/site) is not: it needs the three headers and holds only the caller's organization's sites (?org of a different organization is 403). A single read that sends x-api-key is scoped too: a site of another organization answers 404 like an unknown slug, and the answer also shows who owns it (createdBy, updatedBy); the public answer never does. Each site records the user who created it (createdBy) and who changed it last (updatedBy, both from x-user-id); only its creator can replace or delete it, another user of the organization gets 403, and a site saved before owners were recorded has no creator and stays open to its organization. A wrong key is always 401. A 409 for a domain used by another organization's site names only the domain. Deleting a site (DELETE /api/site/:slug, 204) removes it completely and frees its domains (the sitemap drops its pages when its cache expires); only sites saved through the API can be deleted, the built-in example and Notion rows answer 409. A site without an organization (older stored sites, the built-in example, a Notion row without an Organization relation) belongs to the organization "default". A Notion row gets its organization from its Organization relation (the related page title, slugified).
  A site can own custom domains: a request whose Host matches one is served at the domain root (/ instead of /<slug>); a page the template does not have answers with the template's own 404 page; www redirects to the apex, slug paths redirect to the clean URL, any other host keeps the /<slug> routes.
  Where sites come from: a site saved through the API wins, then a published row of the Notion database (read-only, edits show up within about 60 seconds), then the built-in example. Without a Notion token only the API-saved sites and the example exist. When Notion cannot be reached and nothing is cached, reads answer 503.
  Three templates exist, all in category Portfolios (one per profession): portfolio-model-contact-sheet (a single-page model portfolio) and portfolio-psychiatrist-editorial (a psychiatrist portfolio, two pages: home with the slots hero, ticker, statement, care, approach, appointment and closing, and about with hero, story, credentials, clinic, testimonial and closing; data.contact has email, an optional phone and an optional bookingEndpoint). A site also has an optional googleAnalyticsId (a GA4 measurement id): it reports only to its own property. The layout is fixed and only the content is editable: data.pages.<page> has named slots, never a list of sections. For example the portfolio-model-contact-sheet template is a single page: home has the slots cover, index, sheet, compCard, booking and footer; data.contact carries the booking email and an optional bookingEndpoint (a URL the booking forms POST to; without it the forms open a mailto link). Each slot has `enabled` (false hides the section but keeps its content) and its text, links and images; card lists (index items, sheet frames, comp card measurements and stats, footer links) can grow and shrink within limits published in the JSON Schema of "Get template by ID". Brand colors map to the template as primary (accent color), secondary (paper), accent (index numbers and labels), background and text; the template's typefaces are fixed and brand.fontFamily sets the body font. Unknown keys, pages or slots, and a `sections` list, answer 400.
  Before saving details, a client can check them with GET /api/access (x-api-key, x-org-id and x-user-id, the same three as the writes): 200 with the organization, the user and the organization's site count, 401 for a wrong or missing key (checked first), 400 for an invalid organization or user. It changes nothing and is never cached.
  Some endpoints belong to one template and not to the service (folder 07, Template endpoints): they are served under /api/site/:slug/ and answer 404 for a site whose template does not own them. The Signal template has reads for its projects, experience, hackathons, certificates and open source, and two relays, contact and newsletter, that store nothing and forward to the URLs in data.contact (bookingEndpoint, and the new optional newsletterEndpoint).
  Errors use the Nitro shape { statusCode, statusMessage, message, data? }; validation failures return 400 with data.errors[{ field, message, code }].
variables:
  - key: baseUrl
    value: 'http://localhost:3000'
    description: Base URL of the MWap service
  - key: templateId
    value: portfolio-model-contact-sheet
    description: Template used by the requests
  - key: siteSlug
    value: sample-model
    description: Seeded read-only example site
  - key: newSiteSlug
    value: pm-example-site
    description: Slug created by the Create site request (regenerated on every run)
  - key: customDomain
    value: pm-example-site.example.test
    description: Domain given to the created site (regenerated on every run); the Domains requests send it as Host header
  - key: orgId
    value: pm-org
    description: Organization that owns the created site, sent as x-org-id header on writes
  - key: userId
    value: pm-user
    description: User that makes the writes, sent as x-user-id header
  - key: otherUserId
    value: pm-other-user
    description: A second user of the same organization, used to prove that only the creator can change a site
  - key: formsSlug
    value: pm-forms-site
    description: Signal site with form endpoints, created by the Template endpoints requests (regenerated on every run)
  - key: emptyOrgId
    value: pm-empty-org
    description: An organization that owns no sites, used by the access check
  - key: otherOrgId
    value: pm-other-org
    description: A different organization, used to prove that it cannot replace the site of orgId
