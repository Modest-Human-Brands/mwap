$kind: http-request
name: 'Get all sites without API key'
description: |-
  The list is not public any more: without the access headers it answers 401 and nothing else, so what exists is not revealed.
order: 1050
method: GET
url: '{{baseUrl}}/api/site'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401))
      pm.test('does not list anything', () => pm.expect(pm.response.json()).to.not.have.property('results'))
