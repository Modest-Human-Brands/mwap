$kind: http-request
name: 'Get microverse blogs page'
description: |-
  The blog page at /<slug>/blog: the title and a grid of post cards (thumbnail, title, the start of the excerpt), each linking to /<slug>/blog/<blog.slug>.
order: 4816
method: GET
url: '{{baseUrl}}/:slug/blog'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('lists the posts', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Blogs')
        pm.expect(html).to.include('BLOGS / NOTES FROM THE STUDIO')
        const slug = pm.collectionVariables.get('microverseSlug')
        pm.expect(html).to.include('/' + slug + '/blog/storytelling-beyond-the-product-shot')
      })
