$kind: http-request
name: 'Sitemap lists signal pages'
description: |-
  The sitemap is cached, so this runs right after the editorial check, once both sites exist. It lists the home page and every project page of the signal site: /<slug> and /<slug>/work/rune-infer.
order: 4831
method: GET
url: '{{baseUrl}}/sitemap.xml'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('lists the home page and the project page', () => {
        const xml = pm.response.text()
        const slug = pm.collectionVariables.get('signalSlug')
        pm.expect(xml).to.include('/' + slug + '</loc>')
        pm.expect(xml).to.include('/' + slug + '/work/rune-infer</loc>')
      })
