$kind: http-example
name: '401 Unauthorized'
order: 1000
request:
  url: '{{baseUrl}}/api/site'
  method: POST
response:
  statusCode: 401
  statusText: 'Unauthorized'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "error": true,
        "url": "http://localhost:3000/api/site",
        "statusCode": 401,
        "statusMessage": "Unauthorized",
        "message": "Missing or invalid API key"
      }
