$kind: http-example
name: '503 Source unavailable'
order: 9000
request:
  url: '{{baseUrl}}/api/site/sample-model'
  method: GET
response:
  statusCode: 503
  statusText: 'Service Unavailable'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "error": true,
        "url": "http://localhost:3000/api/site/sample-model",
        "statusCode": 503,
        "statusMessage": "Site source unavailable",
        "message": "Site source unavailable"
      }
