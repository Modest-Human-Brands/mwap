$kind: http-example
name: '404 Other org'
order: 1000
request:
  url: '{{baseUrl}}/api/site/iris-vale'
  method: PUT
response:
  statusCode: 404
  statusText: 'Not Found'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "error": true,
        "url": "http://localhost:3000/api/site/iris-vale",
        "statusCode": 404,
        "statusMessage": "No site found for slug: \"iris-vale\"",
        "message": "No site found for slug: \"iris-vale\""
      }
