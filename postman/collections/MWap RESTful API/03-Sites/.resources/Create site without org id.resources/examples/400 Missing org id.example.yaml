$kind: http-example
name: '400 Missing org id'
order: 1000
request:
  url: '{{baseUrl}}/api/site'
  method: POST
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "error": true,
        "url": "http://localhost:3000/api/site",
        "statusCode": 400,
        "statusMessage": "Bad Request",
        "message": "Bad Request",
        "data": {
          "errors": [
            {
              "field": "x-org-id",
              "message": "Send the organization as a lowercase slug of at most 60 characters",
              "code": "invalid_format"
            }
          ]
        }
      }
