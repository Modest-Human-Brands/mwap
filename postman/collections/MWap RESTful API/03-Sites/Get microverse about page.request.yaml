$kind: http-request
name: 'Get microverse about page'
description: |-
  The about page at /<slug>/about, server-rendered: "Our Story" and the titled sections of the story (the first paragraph has no heading, the "What We Do" style sections may be lists with a bold label), then the team with a portrait, a name and a role for each member. The nav links to it.
order: 4810
method: GET
url: '{{baseUrl}}/:slug/about'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the story and the team', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Our Story')
        pm.expect(html).to.include('Mission &amp; Vision')
        pm.expect(html).to.include('What We Do')
        pm.expect(html).to.include('Team')
        pm.expect(html).to.include('Alex Morgan')
        pm.expect(html).to.include('FOUNDER &amp; LEAD PHOTOGRAPHER')
        pm.expect(html).to.include('id="story"')
        pm.expect(html).to.include('id="team"')
      })
