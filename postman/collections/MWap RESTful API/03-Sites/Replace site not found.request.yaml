$kind: http-request
name: 'Replace site not found'
description: |-
  PUT never creates: an unknown slug is 404.
order: 9000
method: PUT
url: '{{baseUrl}}/api/site/:slug'
pathVariables:
  - key: slug
    value: 'does-not-exist'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
body:
  type: json
  content: |-
    {
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Harbor Films Studio",
        "logoUrl": "https://api.iconify.design/lucide/anchor.svg?color=%230EA5E9&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/anchor.svg?color=%230EA5E9",
        "fontFamily": "Oxanium",
        "colors": {
          "primary": "#0EA5E9",
          "secondary": "#0F172A",
          "accent": "#38BDF8",
          "background": "#020617",
          "text": "#F8FAFC"
        }
      },
      "domains": [
        "{{customDomain}}"
      ],
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=1200&h=630&fit=crop&q=80",
          "canonicalUrl": "https://harbor.example.com"
        },
        "navigation": [
          {
            "label": "Home",
            "href": "/"
          }
        ],
        "pages": {
          "home": {
            "title": "Harbor Films",
            "description": "A coastal production studio.",
            "sections": [
              {
                "type": "hero",
                "id": "hero",
                "title": "Stories From The Waterfront.",
                "subtitle": "A coastal production studio for films, series and campaigns.",
                "cta": {
                  "label": "Get in touch",
                  "href": "#contact"
                },
                "mediaUrl": "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=1920&fit=crop&q=80"
              }
            ]
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))
      pm.test('matches Error schema', () => pm.response.to.have.jsonSchema({ type: 'object', required: ['statusCode', 'statusMessage'], properties: { statusCode: { type: 'number' }, statusMessage: { type: 'string' } } }))
examples: './.resources/Replace site not found.resources/examples/'
