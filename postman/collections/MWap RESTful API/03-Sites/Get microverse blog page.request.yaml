$kind: http-request
name: 'Get microverse blog page'
description: |-
  One post at /<slug>/blog/<blog.slug>: the title, the author and the date, the cover and the article text paragraph by paragraph, with links to the previous and next post.
order: 4817
method: GET
url: '{{baseUrl}}/:slug/blog/:blog'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: blog
    value: 'storytelling-beyond-the-product-shot'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the post', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Storytelling beyond the product shot')
        pm.expect(html).to.include('Back to blogs')
      })
