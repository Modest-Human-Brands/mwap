$kind: http-request
name: 'Get microverse episode page'
description: |-
  One episode at /<slug>/episode/<episode.slug>: the title, the date, the video when the episode has one (a poster until it is played), the article text paragraph by paragraph and links to the previous and next episode.
order: 4814
method: GET
url: '{{baseUrl}}/:slug/episode/:episode'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: episode
    value: 'chocolate-product-shoot'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the episode', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Chocolate packaging shoot')
        pm.expect(html).to.include('Back to episodes')
      })
