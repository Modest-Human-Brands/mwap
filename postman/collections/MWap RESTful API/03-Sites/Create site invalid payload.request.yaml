$kind: http-request
name: 'Create site invalid payload'
description: |-
  Invalid slug, colour and a www domain: 400 with one data.errors entry per field. Nothing is stored.
order: 7000
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "slug": "Not A Slug",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "red",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "domains": [
        "www.example.com"
      ],
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1200&fit=crop&q=80",
          "canonicalUrl": "https://irisvale.example.com"
        },
        "navigation": [
          {
            "label": "Index",
            "href": "#index"
          }
        ],
        "contact": {
          "email": "booking@irisvale.example.com"
        },
        "pages": {
          "home": {
            "title": "Iris Vale",
            "description": "Portfolio of Iris Vale, a fashion and editorial model.",
            "cover": {
              "enabled": true,
              "title": "Iris Vale",
              "tagline": "Fashion and editorial model, based in Berlin.",
              "label": "Frame 00 / Cover",
              "imageUrl": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1920&fit=crop&q=80",
              "portraitUrl": "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&fit=crop&q=80"
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400))
      pm.test('matches Validation Error schema', () => pm.response.to.have.jsonSchema({ type: 'object', required: ['statusCode', 'data'], properties: { statusCode: { const: 400 }, data: { type: 'object', required: ['errors'], properties: { errors: { type: 'array', minItems: 1, items: { type: 'object', required: ['field', 'message', 'code'], properties: { field: { type: 'string' }, message: { type: 'string' }, code: { type: 'string' } } } } } } } }))
      pm.test('reports the invalid fields', () => {
        const fields = pm.response.json().data.errors.map((e) => e.field)
        pm.expect(fields).to.include('slug')
        pm.expect(fields).to.include('brand.colors.primary')
        pm.expect(fields).to.include('domains.0')
      })
examples: './.resources/Create site invalid payload.resources/examples/'
