$kind: http-request
name: 'Get editorial about page'
description: |-
  The about page of the site created by "Create site editorial", server-rendered at /<slug>/about with the navigation of the site, its own title and the analytics script of the site.
order: 4810
method: GET
url: '{{baseUrl}}/:slug/about'
pathVariables:
  - key: slug
    value: '{{editorialSlug}}'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML with the title of the about page', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html')
        pm.expect(pm.response.text()).to.include('About Dr. Anika Rao | Consultant Psychiatrist')
      })
      pm.test('has the sections of the about page', () => {
        const html = pm.response.text()
        for (const id of ['credentials', 'clinic', 'contact']) pm.expect(html, id).to.include('id="' + id + '"')
      })
      pm.test('reports to the analytics property of the site', () => pm.expect(pm.response.text()).to.include('G-ANIKARAO01'))
