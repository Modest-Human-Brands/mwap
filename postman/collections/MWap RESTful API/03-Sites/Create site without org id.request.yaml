$kind: http-request
name: 'Create site without org id'
description: |-
  Writes need an organization: a missing x-org-id header is 400 with data.errors[{ field: 'x-org-id' }]. This request deliberately sends none.
order: 6500
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
body:
  type: json
  content: |-
    {
      "slug": "{{newSiteSlug}}-noorg",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "domains": [
        "{{customDomain}}"
      ],
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1200&fit=crop&q=80",
          "canonicalUrl": "https://irisvale.example.com"
        },
        "navigation": [
          {
            "label": "Index",
            "href": "#index"
          }
        ],
        "contact": {
          "email": "booking@irisvale.example.com"
        },
        "pages": {
          "home": {
            "title": "Iris Vale",
            "description": "Portfolio of Iris Vale, a fashion and editorial model.",
            "cover": {
              "enabled": true,
              "title": "Iris Vale",
              "tagline": "Fashion and editorial model, based in Berlin.",
              "label": "Frame 00 / Cover",
              "imageUrl": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1920&fit=crop&q=80",
              "portraitUrl": "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&fit=crop&q=80"
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400))
      pm.test('matches Error schema', () => pm.response.to.have.jsonSchema({ type: 'object', required: ['statusCode', 'statusMessage'], properties: { statusCode: { type: 'number' }, statusMessage: { type: 'string' } } }))
      pm.test('names the x-org-id header', () => pm.expect(pm.response.json().data.errors.map((e) => e.field)).to.include('x-org-id'))
examples: './.resources/Create site without org id.resources/examples/'
