scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('microverseSlug', 'pm-microverse-' + Date.now())
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('points to the new resource', () => pm.expect(pm.response.headers.get('Location')).to.eql('/api/site/' + pm.collectionVariables.get('microverseSlug')))
      pm.test('stores the template, the brand and the creator', () => {
        const site = pm.response.json()
        pm.expect(site.templateId).to.eql('portfolio-photographer-microverse')
        pm.expect(site.brand.name).to.eql('Nova Frame')
        pm.expect(site.createdBy).to.eql(pm.collectionVariables.get('userId'))
      })
      pm.test('keeps the lists that were sent and fills the rest from the sample', () => {
        const { data } = pm.response.json()
        pm.expect(Object.keys(data.pages)).to.include('home')
        pm.expect(data.photos.map((p) => p.slug)).to.eql(['frame-one', 'frame-two', 'frame-three'])
        pm.expect(data.videos.map((v) => v.slug)).to.eql(['reel-one', 'reel-two'])
        pm.expect(data.packages.map((p) => p.slug)).to.eql(['standard', 'custom'])
        pm.expect(data.pages.home.hero.enabled).to.eql(true)
        pm.expect(data.pages.home.hero.videoUrl).to.be.a('string')
      })
      pm.test('the share preview comes from the brand, not the sample', () => {
        const { data } = pm.response.json()
        pm.expect(data.pages.home.title).to.eql('Nova Frame')
        pm.expect(data.seo.ogImage).to.eql(pm.response.json().brand.logoUrl)
      })
