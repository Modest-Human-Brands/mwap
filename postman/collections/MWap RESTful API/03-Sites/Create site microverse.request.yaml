          },
          {
            "slug": "frame-three",
            "title": "Studio shot of a pair of white sneakers",
            "imageUrl": "https://picsum.photos/seed/nf3/900/900",
            "aspectRatio": 1.0,
            "category": "ecommerce",
            "gallery": false,
            "featured": 2,
            "mediaId": "photo-frame-three",
