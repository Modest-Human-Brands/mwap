$kind: http-request
name: 'Create site microverse'
description: |-
  Creates a site from the portfolio-photographer-microverse template. The three lists are sent whole (they replace the sample lists); the rest is filled from the sample and the share preview from the brand. The site has the home page at /<slug>, one page per photo at /<slug>/photo/<photo.slug> and one per video at /<slug>/video/<video.slug>. A new slug is generated for every run and kept in the collection variable microverseSlug.
order: 4801
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Accept
    value: 'application/json'
  - key: Content-Type
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
  - key: x-user-id
    value: '{{userId}}'
body:
  type: json
  content: |-
