$kind: http-request
name: 'Create site with too many cards'
description: |-
  Card lists have limits (projects 1 to 12, pricing tiers 1 to 4, features per tier 1 to 8, contact links up to 6), published in the JSON Schema of "Get template by ID". 13 projects is 400 with one entry for the list.
order: 5700
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
