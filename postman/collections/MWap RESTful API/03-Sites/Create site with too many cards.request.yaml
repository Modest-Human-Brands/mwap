scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400))
      pm.test('names the list and the limit', () => {
        const error = pm.response.json().data.errors.find((e) => e.field === 'data.pages.home.projects.items')
        pm.expect(error.code).to.eql('too_big')
      })
examples: './.resources/Create site with too many cards.resources/examples/'
