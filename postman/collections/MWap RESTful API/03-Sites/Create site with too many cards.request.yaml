$kind: http-request
name: 'Create site with too many cards'
description: |-
  Card lists have limits (index items 1 to 12, sheet frames 1 to 16, measurements 1 to 10, stats up to 3, footer links up to 6, legal links up to 3, navigation up to 6), published in the JSON Schema of "Get template by ID". 13 index items is 400 with one entry for the list.
order: 5700
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
