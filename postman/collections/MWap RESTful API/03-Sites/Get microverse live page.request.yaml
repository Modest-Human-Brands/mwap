$kind: http-request
name: 'Get microverse live page'
description: |-
  The live page at /<slug>/live. With data.live.status "live" it shows the player (the stream, a LIVE badge and the title of the stream), then NEXT ON AIR with the schedule cards and the replays under Past Streams. With "offline" it shows the poster blurred, "We are off air." and a countdown to data.live.nextAt, with a notify button. The state is decided by the data, not by the clock.
order: 4812
method: GET
url: '{{baseUrl}}/:slug/live'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the live state with the schedule and the replays', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('LIVE')
        pm.expect(html).to.include('Live Stream')
        pm.expect(html).to.include('NEXT ON AIR')
        pm.expect(html).to.include('Schedule')
        pm.expect(html).to.include('Past Streams')
        pm.expect(html).to.include('Food styling live')
      })
