$kind: http-request
name: 'Create site from sample'
description: |-
  A site created from only slug, template, brand and domains (no `data`) is filled from the template sample: the page has a real title, description and every section, and no title contains a `{{ }}` token. Same headers and rules as "Create site".
order: 4500
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "slug": "{{newSiteSlug}}-sample",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "domains": [
        "{{newSiteSlug}}-sample.example.test"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('the page is filled from the sample', () => {
        const { pages, contact } = pm.response.json().data
        pm.expect(Object.keys(pages)).to.have.members(['home'])
        pm.expect(pages.home.title, 'title').to.be.a('string').and.not.empty
        pm.expect(pages.home.description, 'description').to.be.a('string').and.not.empty
        for (const slot of ['cover','index','sheet','compCard','booking','footer']) pm.expect(pages.home[slot].enabled, slot).to.eql(true)
        pm.expect(contact.email).to.be.a('string').and.not.empty
      })
      pm.test('the home page has the named slots and no sections list', () => {
        const home = pm.response.json().data.pages.home
        pm.expect(home).to.include.keys('cover', 'index', 'sheet', 'compCard', 'booking', 'footer')
        pm.expect(home).to.not.have.property('sections')
      })
      pm.test('no placeholder tokens are left', () => pm.expect(pm.response.text()).to.not.include('{{'))
examples: './.resources/Create site from sample.resources/examples/'
