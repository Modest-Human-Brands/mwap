$kind: http-request
name: 'Create site from sample'
description: |-
  A site created from only slug, template, brand and domains (no `data`) is filled from the template sample: every page has a real title, description and sections, and no title contains a `{{ }}` token. Same headers and rules as "Create site".
order: 4500
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "slug": "{{newSiteSlug}}-sample",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Harbor Films",
        "logoUrl": "https://api.iconify.design/lucide/anchor.svg?color=%230EA5E9&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/anchor.svg?color=%230EA5E9",
        "fontFamily": "Oxanium",
        "colors": {
          "primary": "#0EA5E9",
          "secondary": "#0F172A",
          "accent": "#38BDF8",
          "background": "#020617",
          "text": "#F8FAFC"
        }
      },
      "domains": [
        "{{newSiteSlug}}-sample.example.test"
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('every page is filled from the sample', () => {
        const { pages } = pm.response.json().data
        for (const [page, slots] of Object.entries({ home: ['hero', 'projects', 'pricing', 'contact'], projects: ['projects', 'contact'], about: ['hero', 'story', 'contact'] })) {
          pm.expect(pages[page].title, page + ' title').to.be.a('string').and.not.empty
          pm.expect(pages[page].description, page + ' description').to.be.a('string').and.not.empty
          for (const slot of slots) pm.expect(pages[page][slot].enabled, page + '.' + slot).to.eql(true)
        }
      })
      pm.test('home has the hero, projects, pricing and contact slots and no sections list', () => {
        const home = pm.response.json().data.pages.home
        pm.expect(home).to.include.keys('hero', 'projects', 'pricing', 'contact')
        pm.expect(home).to.not.have.property('sections')
      })
      pm.test('no placeholder tokens are left', () => pm.expect(pm.response.text()).to.not.include('{{'))
examples: './.resources/Create site from sample.resources/examples/'
