$kind: http-request
name: 'Get microverse unknown legal page'
description: |-
  A legal page the site does not have answers 404 with the 404 page of the template.
order: 4821
method: GET
url: '{{baseUrl}}/:slug/:legal'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: legal
    value: 'imprint'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 404', () => pm.response.to.have.status(404))
      pm.test('is the 404 page', () => pm.expect(pm.response.text()).to.include('404'))
