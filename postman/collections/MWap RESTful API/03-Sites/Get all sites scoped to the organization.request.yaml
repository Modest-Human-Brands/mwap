$kind: http-request
name: 'Get all sites scoped to the organization'
description: |-
  With the key, organization and user headers the list is the organization's own: only its sites, nothing of other organizations. Without the headers the list stays public (see "Get all sites").
order: 5600
method: GET
url: '{{baseUrl}}/api/site?limit=100&offset=0'
headers:
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
  - key: x-user-id
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('lists only sites of the organization', () => pm.expect(pm.response.json().results.every((s) => s.orgId === pm.collectionVariables.get('orgId'))).to.eql(true))
      pm.test('includes the site created earlier', () => pm.expect(pm.response.json().results.map((s) => s.slug)).to.include(pm.collectionVariables.get('newSiteSlug')))
