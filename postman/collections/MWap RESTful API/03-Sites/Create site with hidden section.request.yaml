$kind: http-request
name: 'Create site with hidden section'
description: |-
  A section can be hidden, not removed: `enabled: false` keeps its content but the page skips it when rendering. Sending only `{ "enabled": false }` is enough, the rest of the slot comes from the sample.
order: 4700
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "slug": "{{newSiteSlug}}-hidden",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "data": {
        "pages": {
          "home": {
            "sheet": {
              "enabled": false
            },
            "compCard": {
              "enabled": false
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('the sections are hidden', () => {
        const { home } = pm.response.json().data.pages
        pm.expect(home.sheet.enabled).to.eql(false)
        pm.expect(home.compCard.enabled).to.eql(false)
      })
      pm.test('hidden sections keep their content, the others stay visible', () => {
        const { home } = pm.response.json().data.pages
        pm.expect(home.sheet.frames.length).to.be.above(0)
        pm.expect(home.compCard.measurements.length).to.be.above(0)
        pm.expect(home.cover.enabled).to.eql(true)
      })
examples: './.resources/Create site with hidden section.resources/examples/'
