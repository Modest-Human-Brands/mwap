$kind: http-request
name: 'Replace site'
description: |-
  Replaces brand, domains and payload of the site created by "Create site" (the whole record, not a merge: omitted domains are removed). Same validation as create. Needs the x-api-key and x-org-id headers; the site keeps its organization. Another organization's site answers 404, like an unknown slug, so slugs of other organizations are not revealed. A site that only exists in Notion can be replaced too: the saved copy then wins over the Notion row from that moment on.
order: 8000
method: PUT
url: '{{baseUrl}}/api/site/:slug'
pathVariables:
  - key: slug
    value: '{{newSiteSlug}}'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale Studio",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "domains": [
        "{{customDomain}}"
      ],
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1200&fit=crop&q=80",
          "canonicalUrl": "https://irisvale.example.com"
        },
        "navigation": [
          {
            "label": "Index",
            "href": "#index"
          }
        ],
        "contact": {
          "email": "booking@irisvale.example.com"
        },
        "pages": {
          "home": {
            "title": "Iris Vale",
            "description": "Portfolio of Iris Vale, a fashion and editorial model.",
            "cover": {
              "enabled": true,
              "title": "Iris Vale",
              "tagline": "Fashion and editorial model, based in Berlin.",
              "label": "Frame 00 / Cover",
              "imageUrl": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1920&fit=crop&q=80",
              "portraitUrl": "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&fit=crop&q=80"
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Site schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['slug', 'orgId', 'templateId', 'brand', 'domains', 'data', 'updatedAt'],
        properties: {
          slug: { type: 'string', pattern: '^[a-z0-9-]+$' },
          orgId: { type: 'string', pattern: '^[a-z0-9-]{1,60}$' },
          templateId: { type: 'string' },
          domains: { type: 'array', items: { type: 'string', pattern: '^[a-z0-9.-]+$' } },
          brand: {
            type: 'object',
            required: ['name', 'logoUrl', 'faviconUrl', 'fontFamily', 'colors'],
            properties: {
              fontFamily: { type: 'string', pattern: '^[A-Za-z0-9 ]{1,60}$' },
              colors: { type: 'object', required: ['primary', 'secondary', 'accent', 'background', 'text'], additionalProperties: { type: 'string', pattern: '^#[0-9a-fA-F]{3,8}$' } }
            }
          },
          data: {
            type: 'object',
            required: ['seo', 'navigation', 'pages'],
            properties: {
              seo: { type: 'object', required: ['ogImage', 'canonicalUrl'] },
              navigation: { type: 'array', items: { type: 'object', required: ['label', 'href'] } },
              pages: {
                type: 'object',
                required: ['home'],
                properties: { home: { required: ['title', 'description', 'cover', 'index', 'sheet', 'compCard', 'booking', 'footer'] } }
              }
            }
          },
          updatedAt: { type: 'string' }
        }
      }))
      pm.test('stays in its organization', () => pm.expect(pm.response.json().orgId).to.eql(pm.collectionVariables.get('orgId')))
      pm.test('brand was replaced', () => pm.expect(pm.response.json().brand.name).to.eql('Iris Vale Studio'))
examples: './.resources/Replace site.resources/examples/'
