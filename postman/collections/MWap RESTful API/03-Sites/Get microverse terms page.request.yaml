$kind: http-request
name: 'Get microverse terms page'
description: |-
  The terms at /<slug>/terms. /privacy, /cancellation and /license have the same layout: the title, the date of the last update and the numbered sections of data.legal.<page>. The footer links to all four.
order: 4819
method: GET
url: '{{baseUrl}}/:slug/:legal'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: legal
    value: 'terms'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the terms', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Terms of Service')
        pm.expect(html).to.include('Last updated')
        pm.expect(html).to.include('Using this website')
      })
