$kind: http-request
name: 'Delete site by another user'
description: |-
  Another user of the same organization cannot delete the site: only its creator can. The answer is 403 and the site stays.
order: 9060
method: DELETE
url: '{{baseUrl}}/api/site/:slug'
pathVariables:
  - key: slug
    value: '{{editorialSlug}}'
headers:
  - key: Accept
    value: 'application/json'
  - key: Content-Type
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
  - key: x-user-id
    value: '{{otherUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 403', () => pm.response.to.have.status(403))
      pm.test('matches Error schema', () => pm.response.to.have.jsonSchema({ type: 'object', required: ['statusCode', 'statusMessage'], properties: { statusCode: { type: 'number' }, statusMessage: { type: 'string' } } }))
