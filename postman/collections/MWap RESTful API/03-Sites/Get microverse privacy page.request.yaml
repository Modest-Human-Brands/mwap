$kind: http-request
name: 'Get microverse privacy page'
description: |-
  The privacy policy at /<slug>/privacy, the same layout as the terms.
order: 4820
method: GET
url: '{{baseUrl}}/:slug/:legal'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
  - key: legal
    value: 'privacy'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the privacy policy', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Privacy Policy')
        pm.expect(html).to.include('Last updated')
      })
