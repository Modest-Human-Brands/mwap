$kind: http-request
name: 'Get microverse episodes page'
description: |-
  The episodes page at /<slug>/episode: the title and a grid of episode cards (thumbnail, title and the start of the excerpt), each linking to /<slug>/episode/<episode.slug>.
order: 4813
method: GET
url: '{{baseUrl}}/:slug/episode'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('lists the episodes', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Episodes')
        pm.expect(html).to.include('EPISODES / BEHIND EVERY SHOOT')
        const slug = pm.collectionVariables.get('microverseSlug')
        pm.expect(html).to.include('/' + slug + '/episode/chocolate-product-shoot')
      })
