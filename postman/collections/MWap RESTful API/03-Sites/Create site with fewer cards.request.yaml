$kind: http-request
name: 'Create site with fewer cards'
description: |-
  Cards are content: a payload may carry fewer index items and sheet frames than the sample (arrays replace the sample's as a whole, within the limits of "Get template by ID"). Everything it leaves out is filled from the sample.
order: 4600
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "slug": "{{newSiteSlug}}-cards",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "data": {
        "pages": {
          "home": {
            "index": {
              "items": [
                {
                  "title": "Project 1",
                  "category": "Campaign",
                  "year": "2026",
                  "description": "A short description.",
                  "imageUrl": "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&fit=crop&q=80"
                },
                {
                  "title": "Project 2",
                  "category": "Campaign",
                  "year": "2026",
                  "description": "A short description.",
                  "imageUrl": "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=800&fit=crop&q=80"
                }
              ]
            },
            "sheet": {
              "frames": [
                {
                  "label": "01",
                  "imageUrl": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600&fit=crop&q=80"
                },
                {
                  "label": "01A",
                  "imageUrl": "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&fit=crop&q=80",
                  "circled": true
                },
                {
                  "label": "02",
                  "imageUrl": "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&fit=crop&q=80"
                },
                {
                  "label": "02A",
                  "imageUrl": "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&fit=crop&q=80"
                }
              ]
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('keeps only the cards that were sent', () => {
        const home = pm.response.json().data.pages.home
        pm.expect(home.index.items.length).to.eql(2)
        pm.expect(home.sheet.frames.length).to.eql(4)
      })
      pm.test('the rest is filled from the sample', () => {
        const home = pm.response.json().data.pages.home
        pm.expect(home.cover.title).to.be.a('string').and.not.empty
        pm.expect(home.compCard.measurements.length).to.be.above(2)
      })
examples: './.resources/Create site with fewer cards.resources/examples/'
