$kind: http-request
name: 'Get all sites scoped with wrong API key'
description: |-
  A wrong key is 401.
order: 5620
method: GET
url: '{{baseUrl}}/api/site'
headers:
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: 'not-the-key'
  - key: x-org-id
    value: '{{orgId}}'
  - key: x-user-id
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401))
