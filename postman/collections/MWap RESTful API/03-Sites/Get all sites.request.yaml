$kind: http-request
name: 'Get all sites'
description: |-
  Paginated list of stored sites (the seeded example site plus every created one). `pagination.total` is the full count.
order: 1000
method: GET
url: '{{baseUrl}}/api/site?limit=50&offset=0'
queryParams:
  - key: limit
    value: '50'
  - key: offset
    value: '0'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Paginated List schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['results', 'pagination'],
        properties: {
          results: { type: 'array', items: { type: 'object', required: ['slug', 'templateId', 'name', 'updatedAt'], properties: { slug: { type: 'string' }, templateId: { type: 'string' }, name: { type: 'string' }, updatedAt: { type: 'string' } } } },
          pagination: { type: 'object', required: ['total', 'limit', 'offset'], properties: { total: { type: 'number' }, limit: { type: 'number' }, offset: { type: 'number' } } }
        }
      }))
      pm.test('includes the seeded site', () => pm.expect(pm.response.json().results.map((s) => s.slug)).to.include(pm.collectionVariables.get('siteSlug')))
examples: './.resources/Get all sites.resources/examples/'
