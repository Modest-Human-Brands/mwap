$kind: http-request
name: 'Get all sites'
description: |-
  Public, paginated list of sites from every source (API-saved, published Notion rows and the built-in example; the API-saved one wins on a slug clash). 503 when the Notion source is unreachable and has no cached copy. `pagination.total` is the full count. Optional `org` query parameter keeps only the sites of one organization.
order: 1000
method: GET
url: '{{baseUrl}}/api/site?limit=50&offset=0'
queryParams:
  - key: limit
    value: '50'
  - key: offset
    value: '0'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Paginated List schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['results', 'pagination'],
        properties: {
          results: { type: 'array', items: { type: 'object', required: ['slug', 'orgId', 'templateId', 'name', 'updatedAt'], properties: { slug: { type: 'string' }, orgId: { type: 'string' }, templateId: { type: 'string' }, name: { type: 'string' }, updatedAt: { type: 'string' } } } },
          pagination: { type: 'object', required: ['total', 'limit', 'offset'], properties: { total: { type: 'number' }, limit: { type: 'number' }, offset: { type: 'number' } } }
        }
      }))
      pm.test('includes the seeded site', () => pm.expect(pm.response.json().results.map((s) => s.slug)).to.include(pm.collectionVariables.get('siteSlug')))
examples: './.resources/Get all sites.resources/examples/'
