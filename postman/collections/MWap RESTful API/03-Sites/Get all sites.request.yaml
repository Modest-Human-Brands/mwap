$kind: http-request
name: 'Get all sites'
description: |-
  Paginated list of the sites of the caller's organization (x-api-key, x-org-id and x-user-id are required: the list is not public). Sites come from every source (API-saved, published Notion rows and the built-in example; the API-saved one wins on a slug clash). 503 when the Notion source is unreachable and has no cached copy. `pagination.total` is the full count of the organization's sites.
order: 1000
method: GET
url: '{{baseUrl}}/api/site?limit=50&offset=0'
queryParams:
  - key: limit
    value: '50'
  - key: offset
    value: '0'
headers:
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
  - key: x-user-id
    value: '{{userId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Paginated List schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['results', 'pagination'],
        properties: {
          results: { type: 'array', items: { type: 'object', required: ['slug', 'orgId', 'templateId', 'name', 'updatedAt'], properties: { slug: { type: 'string' }, orgId: { type: 'string' }, templateId: { type: 'string' }, name: { type: 'string' }, updatedAt: { type: 'string' } } } },
          pagination: { type: 'object', required: ['total', 'limit', 'offset'], properties: { total: { type: 'number' }, limit: { type: 'number' }, offset: { type: 'number' } } }
        }
      }))
      pm.test('lists only sites of the organization', () => pm.expect(pm.response.json().results.every((s) => s.orgId === pm.collectionVariables.get('orgId'))).to.eql(true))
examples: './.resources/Get all sites.resources/examples/'
