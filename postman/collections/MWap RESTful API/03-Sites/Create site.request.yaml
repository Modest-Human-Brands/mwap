$kind: http-request
name: 'Create site'
description: |-
  Validates brand and payload against the template schema (missing fields are filled from the template sample (see "Get template by ID")) and stores the site. Needs the x-api-key and x-org-id headers (400 with data.errors[{ field: "x-org-id" }] when x-org-id is missing or not a lowercase slug of at most 60 characters); the site belongs to that organization. The site is stored by the service, never written to Notion. 409 when the slug exists in any source (a Notion row counts), 404 when the template does not, 400 with data.errors when a field is invalid. `domains` (optional, lowercase apex hostnames) makes the site answer on its own domain; a domain can belong to one site only (409 otherwise) and www hosts are rejected because www redirects to the apex. `googleAnalyticsId` (optional, a GA4 measurement id such as G-ABC123DEF4) turns on Google Analytics for this site only: the site reports to its own property and a site without it sends nothing. A new slug and domain are generated for every run; the collection variables newSiteSlug and customDomain carry them to the following requests.
order: 4000
method: POST
url: '{{baseUrl}}/api/site'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: '{{orgId}}'
body:
  type: json
  content: |-
    {
      "slug": "{{newSiteSlug}}",
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "domains": [
        "{{customDomain}}"
      ],
      "googleAnalyticsId": "G-IRISVALE01",
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1200&fit=crop&q=80",
          "canonicalUrl": "https://irisvale.example.com"
        },
        "navigation": [
          {
            "label": "Index",
            "href": "#index"
          }
        ],
        "contact": {
          "email": "booking@irisvale.example.com"
        },
        "pages": {
          "home": {
            "title": "Iris Vale",
            "description": "Portfolio of Iris Vale, a fashion and editorial model.",
            "cover": {
              "enabled": true,
              "title": "Iris Vale",
              "tagline": "Fashion and editorial model, based in Berlin.",
              "label": "Frame 00 / Cover",
              "imageUrl": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1920&fit=crop&q=80",
              "portraitUrl": "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&fit=crop&q=80"
            }
          }
        }
      }
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      const slug = 'pm-' + Date.now()
      pm.collectionVariables.set('newSiteSlug', slug)
      pm.collectionVariables.set('customDomain', slug + '.example.test')
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201))
      pm.test('belongs to the organization of x-org-id', () => pm.expect(pm.response.json().orgId).to.eql(pm.collectionVariables.get('orgId')))
      pm.test('stores the analytics id of the site', () => pm.expect(pm.response.json().googleAnalyticsId).to.eql('G-IRISVALE01'))
      pm.test('points to the new resource', () => pm.expect(pm.response.headers.get('Location')).to.eql('/api/site/' + pm.collectionVariables.get('newSiteSlug')))
      pm.test('matches Site schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['slug', 'orgId', 'templateId', 'brand', 'domains', 'data', 'updatedAt'],
        properties: {
          slug: { type: 'string', pattern: '^[a-z0-9-]+$' },
          orgId: { type: 'string', pattern: '^[a-z0-9-]{1,60}$' },
          templateId: { type: 'string' },
          domains: { type: 'array', items: { type: 'string', pattern: '^[a-z0-9.-]+$' } },
          googleAnalyticsId: { type: 'string', pattern: '^G-[A-Z0-9]{6,12}$' },
          brand: {
            type: 'object',
            required: ['name', 'logoUrl', 'faviconUrl', 'fontFamily', 'colors'],
            properties: {
              fontFamily: { type: 'string', pattern: '^[A-Za-z0-9 ]{1,60}$' },
              colors: { type: 'object', required: ['primary', 'secondary', 'accent', 'background', 'text'], additionalProperties: { type: 'string', pattern: '^#[0-9a-fA-F]{3,8}$' } }
            }
          },
          data: {
            type: 'object',
            required: ['seo', 'navigation', 'pages'],
            properties: {
              seo: { type: 'object', required: ['ogImage', 'canonicalUrl'] },
              navigation: { type: 'array', items: { type: 'object', required: ['label', 'href'] } },
              pages: {
                type: 'object',
                required: ['home'],
                properties: { home: { required: ['title', 'description', 'cover', 'index', 'sheet', 'compCard', 'booking', 'footer'] } }
              }
            }
          },
          updatedAt: { type: 'string' }
        }
      }))
      pm.test('missing slots are filled from the sample', () => {
        const { data } = pm.response.json()
        pm.expect(Object.keys(data.pages)).to.have.members(['home'])
        pm.expect(data.pages.home.compCard.measurements.length).to.be.above(0)
        pm.expect(data.contact.email).to.be.a('string').and.not.empty
      })
examples: './.resources/Create site.resources/examples/'
