$kind: http-request
name: 'Get microverse projects page'
description: |-
  The projects page at /<slug>/projects: every photo and video of the site as tiles in four columns (a badge says PHOTO or VIDEO), the label with the counts (shoots are the distinct projects, frames are the photos and videos) and the category filter (ALL plus one per category). A tile links to its photo or video page.
order: 4811
method: GET
url: '{{baseUrl}}/:slug/projects'
pathVariables:
  - key: slug
    value: '{{microverseSlug}}'
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is HTML', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html'))
      pm.test('shows the title, the counts and the tiles', () => {
        const html = pm.response.text()
        pm.expect(html).to.include('Projects')
        pm.expect(html).to.include('ALL')
        pm.expect(html).to.match(/PROJECTS\s*·\s*\d+ SHOOTS?\s*·\s*\d+\+? FRAMES/)
        const slug = pm.collectionVariables.get('microverseSlug')
        pm.expect(html).to.include('/' + slug + '/photo/frame-one')
        pm.expect(html).to.include('/' + slug + '/video/reel-one')
      })
