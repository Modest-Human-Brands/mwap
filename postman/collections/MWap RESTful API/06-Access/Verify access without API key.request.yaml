$kind: http-request
name: 'Verify access without API key'
description: |-
  No x-api-key header at all is the same 401.
order: 2100
method: GET
url: '{{baseUrl}}/api/access'
headers:
  - key: x-user-id
    value: '{{userId}}'
  - key: Accept
    value: 'application/json'
  - key: x-org-id
    value: '{{orgId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 401', () => pm.response.to.have.status(401))
      pm.test('matches Error schema', () => pm.response.to.have.jsonSchema({ type: 'object', required: ['statusCode', 'statusMessage'], properties: { statusCode: { type: 'number' }, statusMessage: { type: 'string' } } }))
