$kind: http-request
name: 'Verify access invalid organization'
description: |-
  An organization that is not a lowercase slug of at most 60 characters answers 400 with the field named in data.errors, after the key was accepted.
order: 2200
method: GET
url: '{{baseUrl}}/api/access'
headers:
  - key: x-user-id
    value: '{{userId}}'
  - key: Accept
    value: 'application/json'
  - key: x-api-key
    value: '{{apiKey}}'
  - key: x-org-id
    value: 'Not_A_Slug'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400))
      pm.test('names the x-org-id field', () => pm.expect(pm.response.json().data.errors.map((e) => e.field)).to.include('x-org-id'))
