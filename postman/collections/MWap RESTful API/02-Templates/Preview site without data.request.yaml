$kind: http-request
name: 'Preview site without data'
description: |-
  A preview with only template and brand (no `data`) renders the full sample page: cover, work index, contact sheet, comp card, booking and footer, not just the header.
order: 4500
method: POST
url: '{{baseUrl}}/api/site/template/preview'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "templateId": "{{templateId}}",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('renders the cover and the other sections', () => {
        const { html } = pm.response.json()
        pm.expect(html).to.include('<h1')
        for (const id of ['index', 'sheet', 'comp-card', 'booking', 'footer']) pm.expect(html, id).to.include('id="' + id + '"')
      })
      pm.test('no placeholder tokens are rendered', () => pm.expect(pm.response.json().html).to.not.include('{{'))
examples: './.resources/Preview site without data.resources/examples/'
