$kind: http-request
name: 'Get template by ID'
description: |-
  JSON Schema of the template payload (`data`): the page layout is fixed as named slots (`additionalProperties: false` at every level) and the card lists carry `minItems`/`maxItems`. The shared `brand` block is not part of it: it is the same for every template. Also returns `sample`: a complete, valid payload with neutral wording (real titles, descriptions and sections on every page), so a client can prefill an editor with it. It is exactly what fills the fields a caller leaves out on preview and create: fields the caller sends win, missing ones fall back to the sample.
order: 2000
method: GET
url: '{{baseUrl}}/api/site/template/:id'
pathVariables:
  - key: id
    value: '{{templateId}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Template Detail schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['id', 'label', 'shortLabel', 'category', 'description', 'schema', 'sample'],
        properties: { id: { type: 'string' }, schema: { type: 'object', required: ['type', 'properties'] }, sample: { type: 'object', required: ['seo', 'navigation', 'pages'] } }
      }))
      pm.test('brand is not part of the payload schema', () => pm.expect(pm.response.json().schema.properties).to.not.have.property('brand'))
      pm.test('sample is a complete payload without placeholder tokens', () => {
        const { sample } = pm.response.json()
        pm.expect(JSON.stringify(sample)).to.not.include('{{')
        pm.expect(sample.navigation.length).to.be.above(0)
        pm.expect(sample.contact.email).to.be.a('string').and.not.empty
        pm.expect(Object.keys(sample.pages)).to.have.members(['home'])
        pm.expect(sample.pages.home.title, 'title').to.be.a('string').and.not.empty
        for (const slot of ['cover','index','sheet','compCard','booking','footer']) pm.expect(sample.pages.home[slot].enabled, slot).to.eql(true)
      })
      pm.test('schema fixes the layout and limits the cards', () => {
        const pages = pm.response.json().schema.properties.pages
        pm.expect(pages.additionalProperties).to.eql(false)
        pm.expect(Object.keys(pages.properties)).to.have.members(['home'])
        pm.expect(pages.properties.home.additionalProperties).to.eql(false)
        pm.expect(Object.keys(pages.properties.home.properties)).to.have.members(['title', 'description', ...['cover','index','sheet','compCard','booking','footer']])
        const home = pages.properties.home.properties
        const limits = (list) => [list.minItems, list.maxItems]
        pm.expect(limits(home.index.properties.items)).to.eql([1, 12])
        pm.expect(limits(home.sheet.properties.frames)).to.eql([1, 16])
        pm.expect(limits(home.compCard.properties.measurements)).to.eql([1, 10])
        pm.expect(home.compCard.properties.stats.maxItems).to.eql(3)
        pm.expect(home.footer.properties.links.maxItems).to.eql(6)
        pm.expect(home.footer.properties.legal.maxItems).to.eql(3)
      })
      pm.test('the contact email is required, the booking endpoint is optional', () => {
        const contact = pm.response.json().schema.properties.contact
        pm.expect(contact.required).to.include('email').and.not.include('bookingEndpoint')
      })
examples: './.resources/Get template by ID.resources/examples/'
