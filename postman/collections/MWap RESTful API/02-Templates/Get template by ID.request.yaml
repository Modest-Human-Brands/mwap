$kind: http-request
name: 'Get template by ID'
description: |-
  JSON Schema of the template payload (`data`). The shared `brand` block is not part of it: it is the same for every template. Missing fields are filled from the template placeholders on preview and create.
order: 2000
method: GET
url: '{{baseUrl}}/api/site/template/:id'
pathVariables:
  - key: id
    value: '{{templateId}}'
headers:
  - key: Accept
    value: 'application/json'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Template Detail schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['id', 'label', 'shortLabel', 'category', 'description', 'schema'],
        properties: { id: { type: 'string' }, schema: { type: 'object', required: ['type', 'properties'] } }
      }))
      pm.test('brand is not part of the payload schema', () => pm.expect(pm.response.json().schema.properties).to.not.have.property('brand'))
examples: './.resources/Get template by ID.resources/examples/'
