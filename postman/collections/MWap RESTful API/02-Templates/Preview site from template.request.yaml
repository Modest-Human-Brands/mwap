$kind: http-request
name: 'Preview site from template'
description: |-
  Renders one page of the site as an HTML document without storing anything. Missing fields are filled from the template sample (see "Get template by ID"); invalid fields return 400 with data.errors. `page` is a key of data.pages (default home). Open to the public: no API key needed.
order: 4000
method: POST
url: '{{baseUrl}}/api/site/template/preview'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "templateId": "{{templateId}}",
      "page": "home",
      "brand": {
        "name": "Harbor Films",
        "logoUrl": "https://api.iconify.design/lucide/anchor.svg?color=%230EA5E9&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/anchor.svg?color=%230EA5E9",
        "fontFamily": "Oxanium",
        "colors": {
          "primary": "#0EA5E9",
          "secondary": "#0F172A",
          "accent": "#38BDF8",
          "background": "#020617",
          "text": "#F8FAFC"
        }
      },
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=1200&h=630&fit=crop&q=80",
          "canonicalUrl": "https://harbor.example.com"
        },
        "navigation": [
          {
            "label": "Home",
            "href": "/"
          }
        ],
        "pages": {
          "home": {
            "title": "Harbor Films",
            "description": "A coastal production studio.",
            "hero": {
              "enabled": true,
              "title": "Stories From The Waterfront.",
              "subtitle": "A coastal production studio for films, series and campaigns.",
              "cta": {
                "label": "Get in touch",
                "href": "#contact"
              },
              "mediaUrl": "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=1920&fit=crop&q=80"
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Preview schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['html', 'page'],
        properties: { html: { type: 'string', minLength: 1 }, page: { type: 'string' } }
      }))
      pm.test('html is a document carrying the brand', () => {
        const { html } = pm.response.json()
        pm.expect(html).to.include('<html')
        pm.expect(html).to.include('Harbor Films')
      })
examples: './.resources/Preview site from template.resources/examples/'
