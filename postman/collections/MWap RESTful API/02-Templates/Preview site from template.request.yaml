$kind: http-request
name: 'Preview site from template'
description: |-
  Renders one page of the site as an HTML document without storing anything. Missing fields are filled from the template sample (see "Get template by ID"); invalid fields return 400 with data.errors. `page` is a key of data.pages (default home). Open to the public: no API key needed.
order: 4000
method: POST
url: '{{baseUrl}}/api/site/template/preview'
headers:
  - key: Content-Type
    value: 'application/json'
  - key: Accept
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "templateId": "{{templateId}}",
      "page": "home",
      "brand": {
        "name": "Iris Vale",
        "logoUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F&width=64&height=64",
        "faviconUrl": "https://api.iconify.design/lucide/aperture.svg?color=%23FF3B1F",
        "fontFamily": "Geist",
        "colors": {
          "primary": "#FF3B1F",
          "secondary": "#EEEAE0",
          "accent": "#E8A33D",
          "background": "#0E0E0C",
          "text": "#F2EFE6"
        }
      },
      "data": {
        "seo": {
          "ogImage": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1200&fit=crop&q=80",
          "canonicalUrl": "https://irisvale.example.com"
        },
        "navigation": [
          {
            "label": "Index",
            "href": "#index"
          }
        ],
        "contact": {
          "email": "booking@irisvale.example.com"
        },
        "pages": {
          "home": {
            "title": "Iris Vale",
            "description": "Portfolio of Iris Vale, a fashion and editorial model.",
            "cover": {
              "enabled": true,
              "title": "Iris Vale",
              "tagline": "Fashion and editorial model, based in Berlin.",
              "label": "Frame 00 / Cover",
              "imageUrl": "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1920&fit=crop&q=80",
              "portraitUrl": "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&fit=crop&q=80"
            }
          }
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('matches Preview schema', () => pm.response.to.have.jsonSchema({
        type: 'object',
        required: ['html', 'page'],
        properties: { html: { type: 'string', minLength: 1 }, page: { type: 'string' } }
      }))
      pm.test('html is a document carrying the brand', () => {
        const { html } = pm.response.json()
        pm.expect(html).to.include('<html')
        pm.expect(html).to.include('Iris Vale')
      })
examples: './.resources/Preview site from template.resources/examples/'
