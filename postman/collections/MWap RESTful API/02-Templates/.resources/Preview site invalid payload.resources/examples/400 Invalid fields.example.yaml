$kind: http-example
name: '400 Invalid fields'
order: 1000
request:
  url: '{{baseUrl}}/api/site/template/preview'
  method: POST
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "error": true,
        "url": "http://localhost:3000/api/site/template/preview",
        "statusCode": 400,
        "statusMessage": "Bad Request",
        "message": "Bad Request",
        "data": {
          "errors": [
            {
              "field": "brand.fontFamily",
              "message": "Expected a plain font family name",
              "code": "invalid_format"
            },
            {
              "field": "brand.colors.primary",
              "message": "Expected a hex color",
              "code": "invalid_format"
            }
          ]
        }
      }
