$kind: http-example
name: '400 Empty brand'
order: 1000
request:
  url: '{{baseUrl}}/api/site/template/preview'
  method: POST
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "error": true,
        "url": "http://localhost:3000/api/site/template/preview",
        "statusCode": 400,
        "statusMessage": "Bad Request",
        "message": "Bad Request",
        "data": {
          "errors": [
            {
              "field": "brand.name",
              "message": "Too small: expected string to have >=1 characters",
              "code": "too_small"
            },
            {
              "field": "brand.logoUrl",
              "message": "Invalid URL",
              "code": "invalid_format"
            },
            {
              "field": "brand.faviconUrl",
              "message": "Invalid URL",
              "code": "invalid_format"
            },
            {
              "field": "brand.colors",
              "message": "Invalid input: expected object, received undefined",
              "code": "invalid_type"
            }
          ]
        }
      }
