$kind: http-request
name: 'Get template thumbnail'
description: |-
  The static thumbnail of a template: a pre-rendered PNG of its home page with the sample content, served as a plain file from /templates/<id>.png (no rendering on request). The picker shows it on the template card. Every template has one, so the other two are fetched by the script.
order: 1700
method: GET
url: '{{baseUrl}}/templates/portfolio-developer-signal.png'
headers:
  - key: Accept
    value: 'image/png'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200))
      pm.test('is a PNG image', () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('image/png')
        pm.expect(Number(pm.response.headers.get('Content-Length'))).to.be.above(1000)
      })
      for (const id of ['portfolio-model-contact-sheet', 'portfolio-psychiatrist-editorial']) {
        pm.sendRequest({ url: pm.variables.replaceIn('{{baseUrl}}') + '/templates/' + id + '.png', method: 'GET' }, (error, response) => {
          pm.test(id + ' has a thumbnail', () => {
            pm.expect(error).to.eql(null)
            pm.expect(response.code).to.eql(200)
            pm.expect(response.headers.get('Content-Type')).to.include('image/png')
          })
        })
      }
