$kind: http-example
name: '200 OK'
order: 1000
request:
  url: '{{baseUrl}}/mcp'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "result": {
          "tools": [
            {
              "name": "test",
              "title": "Test",
              "description": "A simple test tool",
              "inputSchema": {
                "$schema": "http://json-schema.org/draft-07/schema#",
                "type": "object",
                "properties": {
                  "message": {
                    "type": "string"
                  }
                },
                "required": [
                  "message"
                ]
              },
              "execution": {
                "taskSupport": "forbidden"
              },
              "_meta": {
                "filename": "test.ts"
              }
            }
          ]
        },
        "jsonrpc": "2.0",
        "id": 2
      }
