$kind: http-example
name: '200 OK'
order: 1000
request:
  url: '{{baseUrl}}/mcp'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
        "result": {
          "content": [
            {
              "type": "text",
              "text": "Test successful: hello"
            }
          ]
        },
        "jsonrpc": "2.0",
        "id": 3
      }
